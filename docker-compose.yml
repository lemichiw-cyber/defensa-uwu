name: mievento

services:
  # ── Backend: Express + SQLite ──
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: mievento-api
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/data.sqlite
      - JWT_SECRET=${JWT_SECRET:-cambia-este-secreto-antes-de-produccion}
    ports:
      - "3001:3001"
    volumes:
      - sqlite-data:/data
    restart: unless-stopped

  # ── Frontend: React servido por nginx (proxy /api → api) ──
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mievento-web
    depends_on:
      - api
    environment:
      # Dentro de la red de compose, el API es el servicio `api`
      - API_ORIGIN=http://api:3001
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqlite-data:
