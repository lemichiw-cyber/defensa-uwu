name: mievento

services:
  # ── Backend: Express + SQLite ──
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: mievento-api
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/data.sqlite
      # ⚠️ Cambia este secreto en producción
      - JWT_SECRET=mievento-docker-secret-cambia-en-produccion
    ports:
      - "3001:3001"
    volumes:
      - sqlite-data:/data
    restart: unless-stopped

  # ── Frontend: React servido por nginx (proxy /api → api) ──
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mievento-web
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  sqlite-data:
