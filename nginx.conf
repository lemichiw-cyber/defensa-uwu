server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compresión para assets y texto
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache largo para assets con hash de Vite
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy del API hacia el contenedor `api` (red interna de Docker)
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # PWA
    location = /sw.js            { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { types { } default_type application/manifest+json; }

    # SPA fallback (rutas de React)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
